<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>LedgerLens · 人工逐条核对</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f7;color:#1e303c;font:15px/1.55 system-ui,'Microsoft YaHei',sans-serif}header{background:#153b48;color:white;padding:20px 28px}h1{font-size:23px;margin:0 0 5px}h2{font-size:19px;margin:0 0 12px}p{margin:8px 0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #9cafb7;border-radius:6px;padding:7px 12px;background:white;color:#163c49}button.primary{background:#176b65;color:white;border-color:#176b65}input,select,textarea{padding:7px;border:1px solid #a6b5ba;border-radius:5px;max-width:100%}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}label{display:block;margin:12px 0 4px}.bar{background:white;padding:14px 28px;border-bottom:1px solid #d7e0e4;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.layout{display:grid;grid-template-columns:330px 1fr;gap:18px;padding:18px;max-width:1450px;margin:auto}aside,main{background:white;border:1px solid #d7e0e4;border-radius:8px;padding:16px}#list{height:66vh;overflow:auto}#list button{display:block;width:100%;text-align:left;margin:6px 0}#list button.active{border:2px solid #176b65;background:#eef9f5}.small{font-size:13px;color:#56707b}.notice{background:#fff4db;border-left:4px solid #d7a128;padding:10px 14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f7;padding:12px;font-size:13px}textarea{width:100%;min-height:60px}.allocation{display:flex;gap:6px;align-items:center;margin:6px 0}.allocation select{width:65%}.allocation input{width:110px}#status{font-weight:600}#search{width:100%}.facts{display:grid;grid-template-columns:90px 1fr;gap:6px}#navigation{display:flex;justify-content:space-between;margin-top:18px}details{margin-top:12px}summary{cursor:pointer}footer{padding:10px 28px 28px;color:#56707b}@media(max-width:760px){.layout{grid-template-columns:1fr}#list{height:210px}.bar{padding:12px}.allocation{flex-wrap:wrap}}
aside,main{min-width:0;overflow-wrap:anywhere}.facts span{min-width:0;overflow-wrap:anywhere}
</style></head><body>
<header><h1>LedgerLens · 人工逐条核对</h1><div>规则检查 → 独立 API 复核 → 你的逐条确认与实际体验</div></header>
<div class="bar"><span id="status"></span><input id="reviewer" placeholder="审核人 / 昵称" aria-label="审核人"><button class="primary" id="save">下载审核进度</button><button id="load">载入审核进度</button><button id="loadCandidate">载入方案结果</button><input hidden type="file" id="truthFile" accept=".json"><input hidden type="file" id="candidateFile" accept=".json"></div>
<div class="layout"><aside><input id="search" placeholder="搜索商户、金额、来源编号" aria-label="搜索记录"><label><input type="checkbox" id="onlyOpen"> 只看未确认</label><div id="list"></div></aside><main>
<p class="notice">本页离线运行，不上传数据。修改仅在当前页面内；离开前请“下载审核进度”。未确认记录不是标准答案。此页面不代替候选软件的实际体验。</p>
<h2 id="title"></h2><div class="facts" id="facts"></div>
<label for="kind">实际用途（由你确认）</label><select id="kind"><option value="">尚未判断</option><option value="expense">支出</option><option value="income">收入</option><option value="refund">购物退款</option><option value="transfer">自有账户转移（不计收支）</option><option value="excluded">排除（须说明原因）</option><option value="pending">待查证</option></select>
<label for="group">是否与另一条原始记录属于同一笔交易？</label><select id="group"></select><p class="small">通常保持本条编号；只有确认两条是重复记录时才选同一编号。原消费与退款不是重复记录，不应放入同一组。</p>
<div id="refund"><label>退款关联的原消费（金额单位：元）</label><div id="allocations"></div><button id="addAllocation">添加原消费</button><p class="small">分笔退款分别指向原消费；无法确认时选择“待查证”，不要猜测。退款总额、原消费上限将在规则检查时校验。</p></div>
<label for="note">审核说明 / 待查证原因</label><textarea id="note"></textarea>
<label><input type="checkbox" id="confirmed"> 我已逐条检查并确认这条记录的用途和关联</label>
<details><summary>查看完整原始字段</summary><pre id="raw"></pre></details>
<details open><summary>当前载入的方案结果（不是标准答案）</summary><pre id="candidate">尚未载入，不影响先审核原始记录。</pre></details>
<div id="navigation"><button id="previous">上一条</button><button id="next">下一条</button></div>
<details><summary>记录一个方案的实际体验</summary><label>方案代号</label><input id="experienceId" placeholder="例如 C01"><label>首次配置 / 本次日常处理 / 纠错耗时（分钟）</label><div><input id="setup" type="number" min="0" placeholder="首次配置"><input id="routine" type="number" min="0" placeholder="日常处理"><input id="correction" type="number" min="0" placeholder="纠错"></div><label>人工修改了多少条</label><input id="edits" type="number" min="0" step="1"><label>方便 / 不方便之处、错误与纠正操作、是否愿意继续用</label><textarea id="experienceNote"></textarea><button id="saveExperience">下载体验记录</button></details>
</main></div><footer id="scope"></footer>
<script type="application/json" id="embedded">__EMBEDDED_DATA__</script>
<script>
'use strict';
const embedded=JSON.parse(document.getElementById('embedded').textContent),data=embedded.dataset;
let truth=embedded.truth,index=0,candidate=null,dirty=false;
const $=id=>document.getElementById(id),rows=data.records, kinds=new Set(['expense','income','refund','transfer','excluded']);
const decision=()=>truth.decisions[index];
const money=c=>(c/100).toFixed(2);
function label(r){return r.platform+' 行'+r.source_row+' · '+r.datetime.slice(5,16)+' · ¥'+money(r.amount_cents)+' · '+r.counterparty;}
function download(name,value){const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function refreshList(){ $('status').textContent='已确认 '+truth.decisions.filter(d=>d.confirmed).length+' / '+rows.length+ (dirty?' · 有未下载修改':'');$('list').replaceChildren();const term=$('search').value.toLowerCase();rows.forEach((r,i)=>{if($('onlyOpen').checked&&truth.decisions[i].confirmed)return;if(term&&!JSON.stringify(r).toLowerCase().includes(term)&&!money(r.amount_cents).includes(term))return;const b=document.createElement('button');b.textContent=(truth.decisions[i].confirmed?'✓ ':'○ ')+label(r);b.className=i===index?'active':'';b.onclick=()=>{index=i;render();};$('list').append(b);});}
function change(){dirty=true;decision().confirmed=false;$('confirmed').checked=false;refreshList();}
function options(select,selected){select.replaceChildren();rows.forEach(r=>{const o=document.createElement('option');o.value=r.source_id;o.textContent=(r.source_id===rows[index].source_id?'本条 · ':'')+label(r);select.append(o);});select.value=selected;}
function renderAllocations(){ $('allocations').replaceChildren();decision().refund_allocations.forEach((a,i)=>{const line=document.createElement('div');line.className='allocation';const target=document.createElement('select'),amount=document.createElement('input'),remove=document.createElement('button');target.setAttribute('aria-label','关联原消费');options(target,a.group_id);amount.type='number';amount.min='0.01';amount.step='0.01';amount.value=money(a.amount_cents);amount.setAttribute('aria-label','退款金额（元）');target.onchange=()=>{a.group_id=target.value;change();};amount.onchange=()=>{const match=/^(\d+)(?:\.(\d{1,2}))?$/.exec(amount.value);if(!match){alert('请输入最多两位小数的非负金额');return;}a.amount_cents=Number(match[1])*100+Number((match[2]||'').padEnd(2,'0'));change();};remove.textContent='移除';remove.onclick=()=>{decision().refund_allocations.splice(i,1);change();renderAllocations();};line.append(target,amount,remove);$('allocations').append(line);});}
function render(){const r=rows[index],d=decision();$('title').textContent=(index+1)+' / '+rows.length+' · '+r.platform+' 原表行 '+r.source_row;$('facts').replaceChildren();for(const [k,v] of [['来源编号',r.source_id],['时间',r.datetime],['金额','¥'+money(r.amount_cents)],['交易对方',r.counterparty],['类型 / 状态',r.type+' / '+r.status],['收支 / 支付',r.direction+' / '+r.method],['商品',r.description]]){const key=document.createElement('span'),value=document.createElement('span');key.className='small';key.textContent=k;value.textContent=v;$('facts').append(key,value);}$('kind').value=d.kind;options($('group'),d.group_id);$('note').value=d.note;$('confirmed').checked=d.confirmed;$('refund').hidden=d.kind!=='refund';renderAllocations();$('raw').textContent=JSON.stringify(r.raw,null,2);$('candidate').textContent=candidate?JSON.stringify(candidate.entries.filter(e=>e.source_ids.includes(r.source_id)),null,2):'尚未载入，不影响先审核原始记录。';refreshList();}
$('kind').onchange=()=>{decision().kind=$('kind').value;if(decision().kind!=='refund')decision().refund_allocations=[];change();render();};$('group').onchange=()=>{decision().group_id=$('group').value;change();};$('note').oninput=()=>{decision().note=$('note').value;change();};$('confirmed').onchange=()=>{const d=decision();if($('confirmed').checked&&(!kinds.has(d.kind)||(d.kind==='excluded'&&!d.note.trim())||(d.kind==='refund'&&(!d.refund_allocations.length||d.refund_allocations.reduce((s,a)=>s+a.amount_cents,0)!==rows[index].amount_cents)))){alert('请明确用途；排除需说明原因，退款需分配完整金额。尚不确定请保持未确认。');$('confirmed').checked=false;return;}d.confirmed=$('confirmed').checked;dirty=true;refreshList();};
$('addAllocation').onclick=()=>{decision().refund_allocations.push({group_id:rows[index].source_id,amount_cents:rows[index].amount_cents});change();renderAllocations();};$('reviewer').value=truth.reviewer;$('reviewer').oninput=()=>{truth.reviewer=$('reviewer').value;dirty=true;refreshList();};$('search').oninput=refreshList;$('onlyOpen').onchange=refreshList;
$('previous').onclick=()=>{index=Math.max(0,index-1);render();};$('next').onclick=()=>{index=Math.min(rows.length-1,index+1);render();};
$('save').onclick=()=>{truth.saved_at=new Date().toISOString();download('truth-review-'+Date.now()+'.json',truth);dirty=false;refreshList();};$('load').onclick=()=>{if(!dirty||confirm('当前修改尚未下载，是否继续载入？'))$('truthFile').click();};$('loadCandidate').onclick=()=>$('candidateFile').click();
$('truthFile').onchange=async e=>{try{const t=JSON.parse(await e.target.files[0].text());if(t.dataset_id!==data.dataset_id||!Array.isArray(t.decisions)||t.decisions.length!==rows.length)throw Error('不是同一份数据或条数不符');const map=new Map(t.decisions.map(d=>[d.source_id,d]));if(map.size!==rows.length||rows.some(r=>!map.has(r.source_id)))throw Error('来源编号缺失或重复');if(t.decisions.some(d=>!Array.isArray(d.refund_allocations)||typeof d.confirmed!=='boolean'||!rows.some(r=>r.source_id===d.group_id)||!['',...kinds,'pending'].includes(d.kind)))throw Error('审核结构不合法');t.decisions=rows.map(r=>map.get(r.source_id));truth=t;dirty=false;$('reviewer').value=t.reviewer||'';render();}catch(err){alert('无法载入：'+err.message);}e.target.value='';};
$('candidateFile').onchange=async e=>{try{const c=JSON.parse(await e.target.files[0].text());if(c.dataset_id!==data.dataset_id||!Array.isArray(c.entries)||c.entries.some(x=>!Array.isArray(x.source_ids)))throw Error('方案结果不匹配');candidate=c;render();}catch(err){alert('无法载入：'+err.message);}e.target.value='';};
$('saveExperience').onclick=()=>{if(!$('experienceId').value.trim()){alert('请填写方案代号');return;}const value=id=>$(id).value===''?null:Number($(id).value);const e={schema_version:1,dataset_id:data.dataset_id,candidate_id:$('experienceId').value.trim(),recorded_at:new Date().toISOString(),setup_minutes:value('setup'),routine_minutes:value('routine'),correction_minutes:value('correction'),edited_records:value('edits'),notes:$('experienceNote').value};if(['setup_minutes','routine_minutes','correction_minutes','edited_records'].some(k=>e[k]!==null&&(!Number.isFinite(e[k])||e[k]<0))){alert('耗时与条数须为非负数');return;}download('experience-'+Date.now()+'.json',e);};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});$('scope').textContent='数据集 '+data.dataset_id.slice(0,12)+' · 2026-08-27 至 2026-09-27 文件快照 · 无银行流水 · 原件不修改。';render();
</script></body></html>
